name: Build ShutFiles

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    env:
      APP_NAME: ShutFiles
      ICON_PATH: assets/sf.ico

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Generate icon if missing
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ICON_PATH)) {
            Write-Host "Иконка не найдена, генерирую..."
            New-Item -ItemType Directory -Force -Path "assets" | Out-Null
            python -c "from PIL import Image, ImageDraw, ImageFont; img=Image.new('RGBA',(256,256),(26,26,26)); d=ImageDraw.Draw(img); d.rectangle([8,8,248,248],outline=(255,215,0),width=8); f=ImageFont.truetype('consola.ttf',130); d.text((70,55),'SF',fill=(255,215,0),font=f); img.save('assets/sf.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          }
          if (-not (Test-Path $env:ICON_PATH)) {
            Write-Error "Не удалось создать иконку"
            exit 1
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "$env:APP_NAME" `
            --icon "$env:ICON_PATH" `
            --add-data "assets/sf.ico;assets" `
            --hidden-import crypto_core `
            main.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          Copy-Item "$env:ICON_PATH" -Destination "dist/sf.ico" -Force
          Set-Content -Path "dist/locked_files.json" -Value "[]" -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.APP_NAME }}.exe
            dist/sf.ico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
